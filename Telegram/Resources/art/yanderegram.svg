<!-- Both mittens sit in front of the folds, gripping rather than pointing. -->
<g fill="#222223" stroke="#deded9" stroke-width="2.25"><path d="M23 62q-1.7-4 1.3-5.3 2.1-1 4.1 1.3 3-.8 4.1 1.9 2.5 1.2 1.8 4.1-.6 3.3-4.1 4.1-5.4 1.1-8.2-3.9"/><path d="M63.5 63.3q-.7-2.7 1.5-4.1 1.9-3 4.6-1.6 2.4-1.6 4.4.6 2.7 1.9 1.1 5.2-2.1 4.9-7.3 5.1-3.2-.4-4.3-3.2"/></g>
