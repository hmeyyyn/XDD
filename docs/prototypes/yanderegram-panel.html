<script>
const $=id=>document.getElementById(id), icon=k=>`<svg class="ic" aria-hidden="true"><use href="#${k}"/></svg>`;
const groups={Интерфейс:[["Точные числа", "12 345 вместо 12.3K."],["Относительное время", "Показывать, как давно человек был в сети."],["Недавние стикеры без лимита", "Хранить старые недавние стикеры на этом устройстве."],['Секунды','Добавлять секунды ко времени сообщений.'],['Аватары в группах','Показывать фото отправителей в группе.'],['Статус в группе','Показывать, кто из отправителей в сети.'],['Скрыть истории','Убрать ленту историй.'],['Кнопка комментариев','Разместить кнопку комментариев справа.'],['Эмодзи текстом','Заменить кнопку эмодзи текстом.'],['Скрыть баланс','Не показывать баланс Gram.'],['Мобильный вид','Использовать мобильную раскладку.'],['Скрыть рейтинг','Не показывать звёздный рейтинг.'],['Недавние адресаты','Показывать недавних получателей при пересылке.']],Сообщения:[["Сохранять удалённые сообщения", "Только полученный текст, до 7 дней."],["Сохранять историю правок", "Записывать текст сообщения до изменения."],['ID сообщения','Номер сообщения в контекстном меню.'],['Число пересылок','Счётчик в информации о сообщении.'],['Данные файла','Показывать размер и формат медиа.'],['Управление GIF','Добавить кнопки управления воспроизведением.']],Поведение:[["Режим призрака", "Не показывать онлайн, набор, запись и загрузку."],['Комментарий после пересылки','Перейти к вводу комментария после пересылки.'],['Похожие каналы','Показывать рекомендации при вступлении.']],Перевод:[['Учитывать контекст','Использовать соседние сообщения при переводе.']],Звонки:[['HD-видео','Использовать повышенное качество видео.'],['Автовключение микрофона','Автоматически включать микрофон в голосовом чате.']],Прочее:[['ID собеседника','Числовой идентификатор в профиле.'],['Информация о чате','Дополнительные технические сведения.']]};
const icons={Интерфейс:'eye',Сообщения:'chat',Поведение:'sliders',Перевод:'lang',Звонки:'call',Прочее:'dots',Кастомизация:'brush'};const on=new Set(['Аватары в группах','Секунды','Кнопка комментариев','Недавние адресаты']);let active='Интерфейс';
function select(k){active=k;$('query').value='';render()}
for(const [k,id] of Object.entries(icons)){const b=document.createElement('button');b.innerHTML=icon(id)+k;b.dataset.page=k;b.onclick=()=>select(k);$(k==='Кастомизация'?'other':'categories').append(b)}
function render(){
 const q=$('query').value.trim().toLowerCase(),out=$('items');out.replaceChildren();out.scrollTop=0;
 document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',!q&&b.dataset.page===active?'page':'false'));
 $('title').textContent=q?'Результаты поиска':active;let n=0;
 for(const [g,list] of Object.entries(groups))for(const [k,d] of list){
  if(q?![g,k,d].join(' ').toLowerCase().includes(q):active!==g)continue;
  const card=document.createElement('label');card.className='card setting-label';card.innerHTML=`<span class="text"><b>${k}</b><small>${d}</small></span><input class="switch" type="checkbox" aria-label="${k}">`;
  const sw=card.lastElementChild;sw.checked=on.has(k);card.classList.toggle('on',sw.checked);sw.onchange=()=>{sw.checked?on.add(k):on.delete(k);card.classList.toggle('on',sw.checked)};out.append(card);n++;
 }
 $('count').textContent=n?'Модулей: '+n:'';
 if(!n){const msg=document.createElement('p');msg.className='empty';msg.textContent=q?'Ничего не найдено':'Настроек оформления пока нет.';out.append(msg)}
}
function navigate(open){$('panel').hidden=!open;$('back').hidden=!open;$('settings').hidden=open;$('screen').textContent=open?'Настройки YandereGram':'Настройки';if(open){select('Интерфейс');$('query').focus()}else $('launch').focus()}
$('query').oninput=render;$('launch').onclick=()=>navigate(true);$('back').onclick=()=>navigate(false);
document.addEventListener('keydown',e=>{if($('panel').hidden)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('query').focus()}if(e.key==='Escape'){if($('query').value){$('query').value='';render()}else navigate(false)}});
</script></html>
